name: family-dinner

services:
  api:
    build: .
    image: family-dinner-time:local
    container_name: family-dinner-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5402/dinner}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
